services:
  - type: web
    name: sabu-ai
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: CLIENT_URL
        sync: false
      - key: AUTH_SECRET
        generateValue: true
      - key: MONGODB_URI
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.6-flash
      - key: VECTOR_STORE_TYPE
        value: mongodb_atlas
      - key: ALLOW_IN_MEMORY_VECTOR_STORE_IN_PROD
        value: "false"
      - key: MAX_FILE_SIZE_MB
        value: "10"
      - key: STORAGE_DIR
        value: storage/documents
      - key: MEDIA_STORAGE_DIR
        value: storage/media
